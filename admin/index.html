<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Under1KFinds — Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <!-- ===================== LOGIN ===================== -->

  <section id="loginView" class="login-screen">

    <div class="login-card">

      <p class="login-mark">
        UNDER<span class="accent">1K</span>FINDS
      </p>

      <h1>Admin login</h1>

      <p class="login-sub">
        Only you can sign in here.
      </p>

      <form id="loginForm">

        <label class="field">
          <span>Email</span>
          <input
            id="loginEmail"
            type="email"
            autocomplete="email"
            required
          >
        </label>

        <label class="field">
          <span>Password</span>
          <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
          >
        </label>

        <button
          id="loginBtn"
          class="btn btn-primary btn-block"
          type="submit"
        >
          Log in
        </button>

        <p
          id="loginError"
          class="login-error"
          hidden
        ></p>

      </form>

    </div>

  </section>


  <!-- ===================== DASHBOARD ===================== -->

  <section id="dashboardView" class="dashboard" hidden>

    <header class="admin-header">

      <h1 class="admin-header-title">
        UNDER<span class="accent">1K</span>FINDS · Admin
      </h1>

      <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
      >
        Log out
      </button>

    </header>


    <main class="admin-main">

      <!-- ===================== OVERVIEW ===================== -->

      <section
        id="panel-overview"
        class="tab-panel"
      >

        <h2 class="panel-title">
          Overview
        </h2>

        <div class="stat-grid">

          <div class="stat-card">
            <p
              id="statTotal"
              class="stat-num"
            >0</p>

            <p class="stat-label">
              Total products
            </p>
          </div>

          <div class="stat-card">
            <p
              id="statVisible"
              class="stat-num"
            >0</p>

            <p class="stat-label">
              Visible
            </p>
          </div>

          <div class="stat-card">
            <p
              id="statFeatured"
              class="stat-num"
            >0</p>

            <p class="stat-label">
              Featured
            </p>
          </div>

        </div>


        <h3 class="section-subtitle">
          Categories
        </h3>

        <div
          id="categoryStats"
          class="chip-list"
        ></div>


        <h3 class="section-subtitle">
          Recently added
        </h3>

        <div
          id="recentList"
          class="recent-list"
        ></div>

      </section>


      <!-- ===================== ADD PRODUCT ===================== -->

      <section
        id="panel-add"
        class="tab-panel"
        hidden
      >

        <h2 class="panel-title">
          Add product
        </h2>

        <form id="productForm">

          <input
            id="productId"
            type="hidden"
          >


          <label class="field">

            <span>
              Product name
            </span>

            <input
              id="f_name"
              type="text"
              required
            >

          </label>


          <label class="field">

            <span>
              Image URL
            </span>

            <input
              id="f_imageUrl"
              type="url"
              placeholder="https://..."
            >

          </label>


          <label class="field">

            <span>
              Upload image
            </span>

            <input
              id="f_imageFile"
              type="file"
              accept="image/*"
            >

            <small class="field-hint">
              Use either an image URL or upload an image.
            </small>

          </label>


          <div class="field-row">

            <label class="field">

              <span>
                Price (₹)
              </span>

              <input
                id="f_price"
                type="number"
                min="0"
                step="1"
                required
              >

            </label>


            <label class="field">

              <span>
                MRP (₹)
              </span>

              <input
                id="f_mrp"
                type="number"
                min="0"
                step="1"
              >

            </label>

          </div>


          <div class="field-row">

            <label class="field">

              <span>
                Discount (%)
              </span>

              <input
                id="f_discount"
                type="number"
                min="0"
                max="100"
                step="1"
              >

            </label>


            <label class="field">

              <span>
                Rating
              </span>

              <input
                id="f_rating"
                type="number"
                min="0"
                max="5"
                step="0.1"
              >

            </label>

          </div>


          <label class="field">

            <span>
              Reviews
            </span>

            <input
              id="f_reviews"
              type="number"
              min="0"
              step="1"
            >

          </label>


          <label class="field">

            <span>
              Description
            </span>

            <textarea
              id="f_description"
              rows="4"
              required
            ></textarea>

          </label>


          <label class="field">

            <span>
              Affiliate link
            </span>

            <input
              id="f_link"
              type="url"
              placeholder="https://www.amazon.in/..."
              required
            >

          </label>


          <div class="field">

            <span>
              Categories
            </span>

            <div
              id="categoryCheckboxes"
              class="checkbox-grid"
            ></div>

          </div>


          <label class="toggle-field">

            <input
              id="f_featured"
              type="checkbox"
            >

            <span>
              Featured product
            </span>

          </label>


          <button
            id="saveBtn"
            class="btn btn-primary btn-block"
            type="submit"
          >
            Publish
          </button>


          <button
            id="cancelEditBtn"
            class="btn btn-ghost btn-block"
            type="button"
            hidden
          >
            Cancel edit
          </button>


          <p
            id="formStatus"
            class="form-status"
            hidden
          ></p>

        </form>

      </section>


      <!-- ===================== MANAGE ===================== -->

      <section
        id="panel-manage"
        class="tab-panel"
        hidden
      >

        <h2 class="panel-title">
          Manage products
        </h2>


        <div class="admin-search">

          <input
            id="manageSearch"
            type="text"
            placeholder="Search products..."
            autocomplete="off"
          >

        </div>


        <p
          id="globalError"
          class="form-status err"
          hidden
        ></p>


        <div
          id="manageList"
          class="manage-list"
        ></div>

      </section>

    </main>


    <!-- ===================== BOTTOM TABS ===================== -->

    <nav class="tab-bar">

      <button
        class="tab-btn active"
        data-tab="overview"
        type="button"
      >
        <span class="tab-icon">⌂</span>
        Overview
      </button>


      <button
        class="tab-btn"
        data-tab="add"
        type="button"
      >
        <span class="tab-icon">＋</span>
        Add
      </button>


      <button
        class="tab-btn"
        data-tab="manage"
        type="button"
      >
        <span class="tab-icon">☷</span>
        Manage
      </button>

    </nav>

  </section>


  <!-- ===================== SCRIPTS ===================== -->

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <script src="../supabase-config.js"></script>

  <script src="admin.js"></script>

</body>
              </html>
